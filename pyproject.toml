[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meninges-annotation"
version = "0.1.0"
description = "Non-destructive B-scan thickness measurement and SVG annotation workflow"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
meninges-annotation = "meninges_annotation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
